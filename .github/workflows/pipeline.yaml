name: CI Pipeline
on:
  push:
    branches: [main]

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
  echo-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: Echo Message
        run: echo "This is the echo job"
      
  log-process:
    runs-on: ubuntu-latest
    # needs: build-job
    steps:
      - name: Log Message
        run: echo "This is the log process job"

  final-job:
    runs-on: ubuntu-latest
    needs: [echo-job, log-process]
    steps:
      - name: Final Step
        run: echo "All jobs completed successfully!"
